<!DOCTYPE html>
<html>
    <head>
        <title>vmk webpage
        </title>
    </head>
    <body>
        <form action="index.html">
            <h1><i>my first form</i></h1>
            name:<br>
            <input type="text" name="username"/><br>
            email:<br>
            <input type="email" name="email"><br>
            password:<br>
            <input type="password" name="password"><br>
            mobile number:<br>
            <input type="tel" name="number"><br>
            adhar number:<br>
            <input type="number" name="number"><br>
            gender(radio button):<br>
            <input type="radio" id="gender" name="gender" value="male">male
            <input type="radio" id="gender" name="gender" value="female">female<br>
            languages(check boxes):<br>
            <input type="checkbox" name="tel" value="on">Telugu<br>
            <input type="checkbox" name="box" value="on">English<br>
            <input type="checkbox" name="box" value="on">Hindi<br>
            skills(slide bar):<br>
            <input type="range"><br>
            programming languages(drop down):<br>
            <select name="dropdown">
                <option value="python">python</option>
                <option value="c">c</option>
                <option value="c++">c++</option>
                <option value="java">java</option>
            </select>
            <br>
             url(links):<br>
             <input type="url" name="url"><br>
             search:<br>
             <input type="search" name="searching"><br>

            upload file:<br>
            <input type="file" name="file upload" accept="image/*"><br>


            date:<br>
            <input type="date" name="joining date"><br>
            time:<br>
            <input type="time" name="joining time"><br>
            date and time:<br>
            <input type="datetime-local" name="joining date and exact time"><br>



            <input type="submit" value="submit">


        </form>
        
    </body>
</html>
